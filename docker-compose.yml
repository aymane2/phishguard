services:
  api:
    build: .
    ports:
      - "8000:8000"

  app:
    build:
      context: .
      dockerfile: Dockerfile.app
    environment:
      - API_URL=http://api:8000
      - STREAMLIT_BROWSER_GATHER_USAGE_STATS=false
    ports:
      - "8501:8501"
    depends_on:
      api:
        condition: service_healthy
